services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${V2_POSTGRES_USER:?Configure V2_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${V2_POSTGRES_PASSWORD:?Configure V2_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${V2_POSTGRES_DB:-app_escuela_v2}
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - app-escuela-v2-postgres-v18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    profiles:
      - test
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${V2_TEST_POSTGRES_USER:-app_escuela_v2_test}
      POSTGRES_PASSWORD: ${V2_TEST_POSTGRES_PASSWORD:-v2_test_only_password}
      POSTGRES_DB: ${V2_TEST_POSTGRES_DB:-app_escuela_v2_test}
    ports:
      - '127.0.0.1:55434:5432'
    volumes:
      - app-escuela-v2-postgres-test-v18:/var/lib/postgresql

  adminer:
    image: adminer:6.1.1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '127.0.0.1:8081:8080'

volumes:
  app-escuela-v2-postgres-v18:
  app-escuela-v2-postgres-test-v18:
